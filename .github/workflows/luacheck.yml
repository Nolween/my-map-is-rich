# Vérification du code à chaque envoi : les erreurs de syntaxe Lua (réglages
# dans .luacheckrc, qui laisse de côté les données générées : Data/Map, Plus/Data)
name: Vérification du code

on:
  push:
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1
        with:
          args: MyMapIsRich
